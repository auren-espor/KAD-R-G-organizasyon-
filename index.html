<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scream Organizasyonu - PUBG Mobile</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f1015; color: #fff; margin: 0; padding: 20px; }
        .header { text-align: center; padding: 10px 0; border-bottom: 2px solid #ff9900; margin-bottom: 20px; }
        .header h1 { color: #ff9900; margin: 0 0 10px 0; }
        .nav-btn { background: #ff9900; color: #000; border: none; padding: 10px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; }
        
        /* Banner & Info */
        .info-box { background: #1a1c23; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; border-left: 4px solid #ff9900; }
        .room-box { background: #222530; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; display: none; }
        .room-box h3 { color: #ff9900; margin-top: 0; }
        
        /* Slot Grid */
        .slots-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
        .slot-card { background: #1a1c23; border: 1px solid #2d313e; border-radius: 8px; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; }
        .slot-title { font-weight: bold; color: #aaa; }
        .slot-team { font-size: 0.95em; color: #ff9900; font-weight: bold; }
        .btn-add { background: #28a745; color: #fff; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 18px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-add:hover { background: #218838; }
        .slot-filled { background: #152219; border-color: #28a745; }

        /* Modal / Pop-up Form */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; padding: 20px; z-index: 100; }
        .modal-content { background: #1a1c23; padding: 20px; border-radius: 10px; width: 100%; max-width: 400px; }
        .modal-content h3 { color: #ff9900; margin-top: 0; }
        .modal-content input { width: 100%; padding: 10px; margin: 6px 0; background: #0f1015; border: 1px solid #2d313e; color: #fff; border-radius: 5px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 15px; }
        .btn-submit { background: #ff9900; color: #000; border: none; padding: 10px; flex: 1; font-weight: bold; border-radius: 5px; cursor: pointer; }
        .btn-cancel { background: #dc3545; color: #fff; border: none; padding: 10px; flex: 1; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <h1>KAD-RG PUBG Mobile Scrim</h1>
        <button class="nav-btn" onclick="toggleRoomBox()">Turnuvaya Katıl / Oda Bilgileri</button>
    </div>

    <!-- Turnuva / Oda Kodu Alanı -->
    <div class="room-box" id="roomBox">
        <h3>Aktivite / Canlı Maç Paneli</h3>
        <p><strong>Oda ID:</strong> <span id="roomId">Maç Saatinde Açıklanacak</span></p>
        <p><strong>Şifre:</strong> <span id="roomPass">****</span></p>
    </div>

    <div class="info-box">
         Slot seçimleri açılmıştır! Uygun slotun yanındaki <strong>"+"</strong> butonuna basarak takımınızı kaydettirebilirsiniz.
    </div>

    <!-- Slot Listesi (1 - 25) -->
    <div class="slots-container" id="slotsContainer"></div>

    <!-- Kayıt Modal Formu -->
    <div class="modal" id="registerModal">
        <div class="modal-content">
            <h3 id="modalTitle">Slot Kaydı</h3>
            <form id="slotForm" onsubmit="saveSlot(event)">
                <input type="hidden" id="selectedSlot">
                <input type="text" id="teamName" placeholder="Takım Adı" required>
                <input type="text" id="p1" placeholder="1. Oyuncu (Lider)" required>
                <input type="text" id="p2" placeholder="2. Oyuncu" required>
                <input type="text" id="p3" placeholder="3. Oyuncu" required>
                <input type="text" id="p4" placeholder="4. Oyuncu" required>
                <input type="text" id="instagram" placeholder="Ulaşabileceğimiz Instagram Hesabı" required>
                
                <div class="modal-actions">
                    <button type="submit" class="btn-submit">Kaydet</button>
                    <button type="button" class="btn-cancel" onclick="closeModal()">İptal</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const TOTAL_SLOTS = 25;
        let slotData = JSON.parse(localStorage.getItem('scrimSlots')) || {};

        function renderSlots() {
            const container = document.getElementById('slotsContainer');
            container.innerHTML = '';

            for (let i = 1; i <= TOTAL_SLOTS; i++) {
                const isFilled = slotData[i];
                const card = document.createElement('div');
                card.className = `slot-card ${isFilled ? 'slot-filled' : ''}`;
                
                card.innerHTML = `
                    <div>
                        <span class="slot-title">SLOT ${i}</span>
                        <div class="slot-team">${isFilled ? isFilled.teamName : 'Boş'}</div>
                    </div>
                    ${!isFilled ? `<button class="btn-add" onclick="openModal(${i})">+</button>` : '<span style="color:#28a745; font-size:12px;">Dolu</span>'}
                `;
                container.appendChild(card);
            }
        }

        function openModal(slotNumber) {
            document.getElementById('selectedSlot').value = slotNumber;
            document.getElementById('modalTitle').innerText = `Slot ${slotNumber} Kaydı`;
            document.getElementById('registerModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('registerModal').style.display = 'none';
            document.getElementById('slotForm').reset();
        }

        function saveSlot(event) {
            event.preventDefault();
            const slotNum = document.getElementById('selectedSlot').value;
            
            slotData[slotNum] = {
                teamName: document.getElementById('teamName').value,
                p1: document.getElementById('p1').value,
                p2: document.getElementById('p2').value,
                p3: document.getElementById('p3').value,
                p4: document.getElementById('p4').value,
                instagram: document.getElementById('instagram').value
            };

            localStorage.setItem('scrimSlots', JSON.stringify(slotData));
            closeModal();
            renderSlots();
        }

        function toggleRoomBox() {
            const box = document.getElementById('roomBox');
            box.style.display = box.style.display === 'block' ? 'none' : 'block';
        }

        // Sayfa yüklendiğinde slotları çiz
        renderSlots();
    </script>
</body>
</html>
